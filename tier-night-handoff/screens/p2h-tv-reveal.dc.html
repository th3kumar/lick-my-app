<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV · Submitter reveal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
.blur{position:relative;width:120px;height:120px;border-radius:16px;border:1.5px solid #1A1A1C;overflow:hidden;box-shadow:3px 3px 0 0 rgb(162, 196, 223), 3px 3px 0 1.5px #1A1A1C;background:#FFFFFF;flex-shrink:0}
.blob{position:absolute;inset:-16px;filter:blur(14px)}
.q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#FFFFFF;-webkit-text-stroke:1.5px #1A1A1C}
.slot{flex:1;display:flex;align-items:center;gap:12px;background:#FFFFFF;border:1.5px solid #1A1A1C;border-radius:16px;padding:14px 16px;min-width:0}
.tok{width:40px;height:40px;border-radius:999px;border:1.5px solid #1A1A1C;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;flex-shrink:0}
</style>
</helmet>
<div style="width: 1280px; height: 720px; overflow: hidden; font-family: Nunito, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0B0B0C; background: #FFFFFF; padding: 40px 64px; display: flex; flex-direction: column; gap: 28px">
  <div style="display: flex; align-items: baseline; justify-content: space-between">
    <div style="display: flex; align-items: baseline; gap: 12px"><span style="font-size: 18px; font-weight: 800; letter-spacing: -0.01em">Tonight’s submitters</span><span style="font-size: 15px; font-weight: 700; color: #6B6B70">in random order</span></div>
    <span style="font-size: 15px; font-weight: 700; color: #6B6B70">3 of 5</span>
  </div>

  <section style="flex: 1; background: #FFFFFF; border: 1.5px solid #1A1A1C; border-radius: 20px; box-shadow: 5px 5px 0 0 rgb(162, 196, 223), 5px 5px 0 1.5px #1A1A1C; padding: 28px 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px">
    <div style="font-size: 16px; font-weight: 700; color: #6B6B70">Next up</div>
    <div style="font-size: 104px; font-weight: 900; letter-spacing: -0.04em; line-height: 0.95">mantu</div>
    <div style="display: flex; align-items: center; gap: 22px">
      <div class="blur"><div class="blob" aria-hidden="true" style="background: radial-gradient(circle at 35% 40%, #4C8DC2 0 22%, transparent 23%), radial-gradient(circle at 70% 75%, #C2704C 0 30%, transparent 31%), rgba(76, 141, 194, 0.35)"></div><span class="q">?</span></div>
      <div class="blur"><div class="blob" aria-hidden="true" style="background: radial-gradient(circle at 60% 30%, #C2A24C 0 26%, transparent 27%), radial-gradient(circle at 25% 80%, #4C8DC2 0 28%, transparent 29%), rgba(194, 162, 76, 0.3)"></div><span class="q">?</span></div>
      <div class="blur"><div class="blob" aria-hidden="true" style="background: radial-gradient(circle at 50% 55%, #C24C7A 0 22%, transparent 23%), radial-gradient(circle at 20% 20%, #7AB648 0 25%, transparent 26%), rgba(194, 76, 122, 0.25)"></div><span class="q">?</span></div>
      <div class="blur"><div class="blob" aria-hidden="true" style="background: radial-gradient(circle at 30% 65%, #7A4CC2 0 30%, transparent 31%), radial-gradient(circle at 75% 25%, #4C8DC2 0 18%, transparent 19%), rgba(122, 76, 194, 0.25)"></div><span class="q">?</span></div>
      <div style="margin-left: 12px">
        <div style="font-size: 28px; font-weight: 800; color: #4C8DC2">4 characters</div>
        <div style="font-size: 15px; font-weight: 700; color: #6B6B70; margin-top: 2px">blurred until they’re picked</div>
      </div>
    </div>
  </section>

  <div style="display: flex; gap: 16px; padding: 0 5px 5px 0">
    <div class="slot" style="box-shadow: 3px 3px 0 0 rgb(186, 217, 160), 3px 3px 0 1.5px #1A1A1C"><span class="tok" style="background: rgba(122, 182, 72, 0.22)">S</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1">[user 5]</span><span style="display: block; font-size: 13px; font-weight: 700; color: #6B6B70">4 characters</span></span></div>
    <div class="slot" style="box-shadow: 3px 3px 0 0 rgb(223, 162, 186), 3px 3px 0 1.5px #1A1A1C"><span class="tok" style="background: rgba(194, 76, 122, 0.22)">R</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1">[user 2]</span><span style="display: block; font-size: 13px; font-weight: 700; color: #6B6B70">3 characters</span></span></div>
    <div class="slot" style="border-width: 2.5px; box-shadow: 3px 3px 0 0 rgb(162, 196, 223), 3px 3px 0 1.5px #1A1A1C"><span class="tok" style="background: rgba(76, 141, 194, 0.22)">M</span><span style="flex: 1; min-width: 0"><span style="display: block; font-size: 19px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.1">mantu</span><span style="display: block; font-size: 13px; font-weight: 700; color: #6B6B70">4 characters</span></span></div>
    <div class="slot" style="border-color: #C4C4C7"><span class="tok" style="border-color: #C4C4C7; color: #C4C4C7">?</span><span style="font-size: 19px; font-weight: 800; color: #C4C4C7">Who’s next</span></div>
    <div class="slot" style="border-color: #C4C4C7"><span class="tok" style="border-color: #C4C4C7; color: #C4C4C7">?</span><span style="font-size: 19px; font-weight: 800; color: #C4C4C7">Who’s next</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
