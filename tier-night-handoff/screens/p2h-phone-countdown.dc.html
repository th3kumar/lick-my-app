<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone · Countdown</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
@keyframes sd-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.dnum{font-size:62px;font-weight:900;letter-spacing:-0.04em;line-height:1;color:#FFFFFF;-webkit-text-stroke:2px #1A1A1C;text-shadow:4px 4px 0 #C9CEF0}
.dunit{font-size:34px;font-weight:900;letter-spacing:-0.02em;line-height:1;color:#C9CEF0;-webkit-text-stroke:1.5px #1A1A1C}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; font-family: Nunito, 'SF Pro Rounded', -apple-system, system-ui, sans-serif; color: #0B0B0C; background: #FFFFFF; padding: 16px 16px 24px; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; min-height: 40px">
    <span style="font-size: 16px; font-weight: 800; letter-spacing: -0.01em">Tier Night</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: #6B6B70"><span style="width: 10px; height: 10px; border-radius: 999px; background: #34C759; border: 1.5px solid #1A1A1C"></span>[user 3]</span>
  </div>
  <h1 style="margin: 0; font-size: 38px; font-weight: 900; letter-spacing: -0.035em; line-height: 1.1">Here we go</h1>
  <p style="margin: 8px 0 0; font-size: 13px; font-weight: 600; color: #6B6B70; line-height: 1.5">[topic]. keep this open — your tier buttons appear here for every vote.</p>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
    <div style="position: relative; width: 150px; height: 150px; display: flex; align-items: center; justify-content: center">
      <div aria-hidden="true" style="position: absolute; inset: 0; animation: sd-spin 8s linear infinite">
        <sc-for list="{{ring}}" as="c" hint-placeholder-count="36"><span style="{{c.style}}">{{c.ch}}</span></sc-for>
      </div>
      <div style="display: flex; align-items: baseline; gap: 2px"><span class="dnum">7</span><span class="dunit">s</span></div>
    </div>
    <div style="font-size: 16px; font-weight: 800">Until the show starts</div>
  </div>

  <div style="background: #7FD8DE; border: 1.5px solid #1A1A1C; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <div style="width: 100%; height: 88px; border-radius: 10px; background: repeating-linear-gradient(135deg, rgba(11,11,12,.12) 0 6px, rgba(11,11,12,0) 6px 12px); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #0B0B0C">character art — drop here</div>
    <div style="background: #FFFFFF; border: 1.5px solid #1A1A1C; border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 800">EYES ON THE TV</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
function arc(label, radius, color) {
  const s = (label.toUpperCase() + '  •  ').repeat(3).split('');
  const step = 360 / s.length;
  return s.map((ch, i) => ({
    ch: ch === ' ' ? ' ' : ch,
    style: {
      position: 'absolute', left: '50%', top: '50%', width: 0, height: 0,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      fontSize: '11px', fontWeight: 800, letterSpacing: '0.08em', color,
      transform: `rotate(${i * step}deg) translateY(-${radius}px)`
    }
  }));
}
class Component extends DCLogic {
  renderVals() {
    return { ring: arc('Starting', 62, '#C2704C') };
  }
}
</script>
</body>
</html>
